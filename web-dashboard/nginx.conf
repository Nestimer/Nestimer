server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Pass through the real client IP that host nginx set; $remote_addr here is the
        # host-nginx hop. The API rate-limits on X-Real-IP (app/rate_limit.py::client_ip).
        proxy_set_header X-Real-IP $http_x_real_ip;
    }
}
